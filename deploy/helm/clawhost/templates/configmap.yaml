apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clawhost.fullname" . }}-config
  labels:
    {{- include "clawhost.labels" . | nindent 4 }}
data:
  config.toml: |
    [server]
    port = {{ .Values.server.port }}

    [db]
    host = {{ include "clawhost.dbHost" . | quote }}
    port = {{ include "clawhost.dbPort" . }}
    user = {{ include "clawhost.dbUser" . | quote }}
    database = {{ include "clawhost.dbName" . | quote }}
    sslmode = {{ include "clawhost.dbSSLMode" . | quote }}
    timezone = "Asia/Shanghai"

    [kubernetes]
    kubeconfig = ""
    namespace = {{ .Values.kubernetes.namespace | quote }}

    [storage]
    pvc_name = {{ .Values.storage.pvcName | quote }}
    base_path = {{ .Values.storage.basePath | quote }}

    [domain]
    api_domain = {{ (default .Values.domain.botDomain .Values.domain.apiDomain) | quote }}
    bot_domain_suffix = {{ .Values.domain.botDomain | quote }}
    bot_domain_template = {{ printf "https://{bot_id}.%s" .Values.domain.botDomain | quote }}

    [openclaw]
    image = {{ .Values.openclaw.image | quote }}
    {{- if .Values.openclaw.imagePullSecret }}
    image_pull_secret = {{ .Values.openclaw.imagePullSecret | quote }}
    {{- end }}
    gateway_port = {{ .Values.openclaw.gatewayPort }}
    node_max_old_space_size = {{ .Values.openclaw.nodeMaxOldSpaceSize }}
    cpu_limit = {{ .Values.openclaw.cpuLimit | quote }}
    memory_limit = {{ .Values.openclaw.memoryLimit | quote }}
    cpu_request = {{ .Values.openclaw.cpuRequest | quote }}
    memory_request = {{ .Values.openclaw.memoryRequest | quote }}

    {{- if .Values.chatclaw.image }}
    [chatclaw]
    image = {{ .Values.chatclaw.image | quote }}
    port = {{ .Values.chatclaw.port }}
    cpu_limit = {{ .Values.chatclaw.cpuLimit | quote }}
    memory_limit = {{ .Values.chatclaw.memoryLimit | quote }}
    cpu_request = {{ .Values.chatclaw.cpuRequest | quote }}
    memory_request = {{ .Values.chatclaw.memoryRequest | quote }}
    db_backend = {{ .Values.chatclaw.dbBackend | quote }}
    data_dir = {{ .Values.chatclaw.dataDir | quote }}
    auth_enabled = {{ .Values.chatclaw.authEnabled | quote }}
    multi_company = {{ .Values.chatclaw.multiCompany | quote }}
    {{- end }}
