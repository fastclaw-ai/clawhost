## ClawHost Helm Chart Values

## -- Override the release name
nameOverride: ""
fullnameOverride: ""

## ClawHost server
server:
  image:
    repository: clawhost
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 18080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

## Admin API token (required)
adminToken: "change-me"

## Database
postgresql:
  ## -- Set to false to use an external database
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
  auth:
    database: clawhost
    username: postgres
    password: "postgres"
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

## External database (used when postgresql.enabled=false)
externalDatabase:
  host: ""
  port: 5432
  user: "postgres"
  password: ""
  database: "clawhost"
  sslmode: "disable"

## Kubernetes config for bot management
kubernetes:
  namespace: clawhost

## Shared storage for bot data
storage:
  pvcName: clawhost-shared-data
  size: 10Gi
  basePath: /clawhost-data

## Domain config
## botDomain is the only required setting. apiDomain defaults to botDomain if not set.
domain:
  botDomain: clawhost.ai
  apiDomain: ""

## OpenClaw bot config
openclaw:
  image: "1panel/openclaw:latest"
  imagePullSecret: ""
  gatewayPort: 18789
  cpuLimit: "2000m"
  memoryLimit: "4Gi"
  cpuRequest: "500m"
  memoryRequest: "1Gi"

## ChatClaw WebUI (optional sidecar)
## When image is set, ChatClaw is deployed alongside OpenClaw in each bot pod.
## When image is empty (default), OpenClaw's built-in WebUI is used.
chatclaw:
  image: ""
  port: 3000

## Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: clawhost.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
