apiVersion: v1
kind: ConfigMap
metadata:
  name: clawhost-config
  namespace: clawhost
data:
  config.toml: |
    [server]
    port = 18080

    [db]
    host = "clawhost-pg"
    port = 5432
    user = "postgres"
    password = ""
    database = "clawhost"
    sslmode = "disable"
    timezone = "Asia/Shanghai"

    [kubernetes]
    kubeconfig = ""
    namespace = "clawhost"

    [storage]
    pvc_name = "clawhost-shared-data"
    base_path = "/clawhost-data"

    [domain]
    api_domain = "clawhost.ai"
    bot_domain_suffix = "clawhost.ai"
    bot_domain_template = "https://{bot_id}.clawhost.ai"

    [openclaw]
    image = "1panel/openclaw:latest"
    gateway_port = 18789
    node_max_old_space_size = 6144
    cpu_limit = "2000m"
    memory_limit = "8Gi"
    cpu_request = "500m"
    memory_request = "1Gi"

    # ChatClaw WebUI (optional, uncomment to enable)
    # [chatclaw]
    # image = "chatclaw:latest"
    # port = 3000
    # cpu_limit = "1000m"
    # memory_limit = "1Gi"
    # cpu_request = "100m"
    # memory_request = "256Mi"
    # db_backend = "drizzle"
    # data_dir = "/data"
    # auth_enabled = "false"
    # multi_company = "false"
