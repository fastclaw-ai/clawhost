apiVersion: batch/v1
kind: CronJob
metadata:
  name: clawhost-reconcile
  namespace: clawhost
spec:
  schedule: "*/30 * * * *" # Every 30 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: clawhost
          restartPolicy: Never
          containers:
            - name: reconcile
              image: clawhost:latest
              imagePullPolicy: IfNotPresent
              command: ["./clawhost", "reconcile"]
              env:
                - name: CLAWHOST_API_ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: clawhost-secrets
                      key: admin-token
                - name: CLAWHOST_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: clawhost-secrets
                      key: db-password
              volumeMounts:
                - name: config
                  mountPath: /app/config.toml
                  subPath: config.toml
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: config
              configMap:
                name: clawhost-config
